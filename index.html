<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGRO AUTO FLOW</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden; /* вимикаємо ручний скрол */
    font-family: Arial, sans-serif;
}

.wrapper {
    width: 100%;
    height: 200vh; /* 2 екрани */
    transition: transform 1.2s ease-in-out;
}

.section {
    width: 100%;
    height: 100vh;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
</style>
</head>

<body>

<div class="wrapper" id="wrapper">

    <div class="section">
        <iframe src="https://lavandaaudit.github.io/agro.chikulay.pro/"></iframe>
    </div>

    <div class="section">
        <iframe src="https://lavandaaudit.github.io/agro.obstanovka/"></iframe>
    </div>

</div>

<script>
let current = 0;
const wrapper = document.getElementById('wrapper');
const total = 2;

function autoSlide() {
    current++;
    if (current >= total) {
        current = 0;
    }
    wrapper.style.transform = `translateY(-${current * 100}vh)`;
}

setInterval(autoSlide, 8000); // 8 секунд
</script>

</body>
</html>
