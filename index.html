<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGRO FLOW</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth; /* плавний скрол */
}

body {
    background: #000;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
}

/* Кожен блок = повний екран */
.section {
    width: 100%;
    height: 100vh;
}

/* iframe без внутрішнього скролу */
iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* мобільна стабілізація */
@media (max-width: 768px) {
    .section {
        height: 100dvh; /* правильна висота на мобільних */
    }
}
</style>
</head>

<body>

<div class="section">
    <iframe src="https://lavandaaudit.github.io/agro.chikulay.pro/"></iframe>
</div>

<div class="section">
    <iframe src="https://lavandaaudit.github.io/agro.obstanovka/"></iframe>
</div>

</body>
</html>
